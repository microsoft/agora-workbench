name: Linting
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: linting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.detect.outputs.src }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: detect
        shell: bash
        run: |
          # Get the base branch
          git fetch origin ${{ github.base_ref }}
          BASE="origin/${{ github.base_ref }}"
          
          if git diff --name-only $BASE...HEAD | grep -qE '^src/'; then
            echo "src=true" >> $GITHUB_OUTPUT
          else
            echo "src=false" >> $GITHUB_OUTPUT
          fi

  linting-src:
    name: Lint src
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: uv sync
      
      - name: Install Pyright
        run: uv pip install pyright
      
      - name: Run Ruff
        run: uv run ruff check --output-format=github src
      
      - name: Run Pyright
        run: uv run pyright --level error src
