name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to test"
        required: true
        default: "main"
        type: string

concurrency:
  group: testpypi-${{ github.event.inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build candidate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set unique candidate version
        id: candidate
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          path = Path("pyproject.toml")
          content = path.read_text()
          version = tomllib.loads(content)["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"TestPyPI candidates require a stable base version, found: {version}")

          candidate = f"{version}.dev{os.environ['RUN_ID']}"
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{candidate}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update project.version in pyproject.toml")
          path.write_text(updated)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={candidate}", file=output)
          PY

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: python .github/scripts/validate_distribution.py

      - name: Smoke-test installed wheel
        run: .github/scripts/smoke_test_wheel.sh

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish candidate distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agora-workbench/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-python-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    name: Install candidate from TestPyPI
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Download local distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-python-distributions
          path: dist/

      - name: Install runtime dependencies
        run: |
          uv venv .testpypi-venv --python 3.11
          uv pip install --python .testpypi-venv/bin/python dist/*.whl
          uv pip uninstall --python .testpypi-venv/bin/python agora-workbench

      - name: Install candidate from TestPyPI
        env:
          CANDIDATE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in {1..6}; do
            if uv pip install \
              --python .testpypi-venv/bin/python \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --refresh-package agora-workbench \
              "agora-workbench==$CANDIDATE_VERSION"; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Candidate did not become available on TestPyPI." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify installed candidate
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.testpypi-venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          import agora_workbench

          installed = version("agora-workbench")
          expected = os.environ["EXPECTED_VERSION"]
          if installed != expected:
              raise SystemExit(f"Expected {expected}, found {installed}")
          print(agora_workbench.__file__)

          scripts = {entry.name: entry for entry in entry_points(group="console_scripts")}
          for name in ("mcp-connector-server", "agora-workbench-deploy"):
              if name not in scripts:
                  raise SystemExit(f"Missing console entry point: {name}")
              if not callable(scripts[name].load()):
                  raise SystemExit(f"Console entry point is not callable: {name}")
          PY
