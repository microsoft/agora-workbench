# This workflow runs tests on the src module when relevant files change
# Tests code_execution, connector, domain examples, agent_helpers (llm + mcp), and activity_ui

name: Tests

permissions:
  id-token: write
  contents: read
  pull-requests: read
  
on:
  workflow_dispatch:  # Manual trigger anytime
  pull_request:
    paths:
      - 'src/**'
      - 'activity_ui/**'
      - 'agent_helpers/**'
      - 'examples/**'
      - '.github/workflows/tests.yaml'
    
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for path checking
          submodules: recursive
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          uv sync

      - name: Run code execution tests
        id: code_execution_tests
        continue-on-error: true
        run: |
          uv run pytest src/code_execution/tests/ -m "not live" -v --json-report --json-report-file=code-execution-report.json

      - name: Run connector tests
        id: connector_tests
        continue-on-error: true
        run: |
          uv run pytest src/connector/tests/ -m "not live" -v --json-report --json-report-file=connector-report.json

      - name: Run domain examples tests
        id: domain_examples_tests
        continue-on-error: true
        run: |
          uv run pytest examples/domain_examples/tests/ -m "not live" -v --json-report --json-report-file=domain-examples-report.json

      - name: Run agent helpers tests
        id: agent_helpers_tests
        continue-on-error: true
        run: |
          uv sync --extra agent
          uv run pytest agent_helpers/ -m "not live" -v --json-report --json-report-file=agent-helpers-report.json

      - name: Run activity UI tests
        id: activity_ui_tests
        continue-on-error: true
        run: |
          uv run pytest activity_ui/tests/ -m "not live" -v --json-report --json-report-file=activity-ui-report.json
      
      - name: Test Summary
        if: always()
        run: |
          code_execution_status="${{ steps.code_execution_tests.outcome }}"
          connector_status="${{ steps.connector_tests.outcome }}"
          domain_examples_status="${{ steps.domain_examples_tests.outcome }}"
          agent_helpers_status="${{ steps.agent_helpers_tests.outcome }}"
          activity_ui_status="${{ steps.activity_ui_tests.outcome }}"
          
          echo "## Test Results"
          if [ "$code_execution_status" == "success" ]; then
            echo "✅ Code execution tests passed"
          else
            echo "❌ Code execution tests failed"
          fi

          if [ "$connector_status" == "success" ]; then
            echo "✅ Connector tests passed"
          else
            echo "❌ Connector tests failed"
          fi

          if [ "$domain_examples_status" == "success" ]; then
            echo "✅ Domain examples tests passed"
          else
            echo "❌ Domain examples tests failed"
          fi

          if [ "$agent_helpers_status" == "success" ]; then
            echo "✅ Agent helpers tests passed"
          else
            echo "❌ Agent helpers tests failed"
          fi

          if [ "$activity_ui_status" == "success" ]; then
            echo "✅ Activity UI tests passed"
          else
            echo "❌ Activity UI tests failed"
          fi
          
          if [ "$code_execution_status" == "success" ] && [ "$connector_status" == "success" ] && [ "$domain_examples_status" == "success" ] && [ "$agent_helpers_status" == "success" ] && [ "$activity_ui_status" == "success" ]; then
            exit 0
          else
            exit 1
          fi
