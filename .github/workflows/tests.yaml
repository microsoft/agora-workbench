# This workflow runs tests on the src module when relevant files change
# Tests auth, code_execution, domain examples, and llm packages

name: Tests

permissions:
  id-token: write
  contents: read
  pull-requests: read
  
on:
  workflow_dispatch:  # Manual trigger anytime
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/tests.yaml'
    
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for path checking
          submodules: recursive
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          uv sync
      
      - name: Run auth tests
        id: auth_tests
        continue-on-error: true
        run: |
          uv run pytest src/utilities/auth/tests/ -m "not live" -v --json-report --json-report-file=auth-report.json

      - name: Run code execution tests
        id: code_execution_tests
        continue-on-error: true
        run: |
          uv run pytest src/code_execution/tests/ -m "not live" -v --json-report --json-report-file=code-execution-report.json

      - name: Run domain examples tests
        id: domain_examples_tests
        continue-on-error: true
        run: |
          uv run pytest src/domain_examples/tests/ -m "not live" -v --json-report --json-report-file=domain-examples-report.json

      - name: Run llm tests
        id: llm_tests
        continue-on-error: true
        run: |
          uv sync --extra maf
          uv run pytest src/llm/tests/ -m "not live" -v --json-report --json-report-file=llm-report.json
      
      - name: Test Summary
        if: always()
        run: |
          auth_status="${{ steps.auth_tests.outcome }}"
          code_execution_status="${{ steps.code_execution_tests.outcome }}"
          domain_examples_status="${{ steps.domain_examples_tests.outcome }}"
          llm_status="${{ steps.llm_tests.outcome }}"
          
          echo "## Test Results"
          if [ "$auth_status" == "success" ]; then
            echo "✅ Auth tests passed"
          else
            echo "❌ Auth tests failed"
          fi
          
          if [ "$code_execution_status" == "success" ]; then
            echo "✅ Code execution tests passed"
          else
            echo "❌ Code execution tests failed"
          fi

          if [ "$domain_examples_status" == "success" ]; then
            echo "✅ Domain examples tests passed"
          else
            echo "❌ Domain examples tests failed"
          fi

          if [ "$llm_status" == "success" ]; then
            echo "✅ LLM tests passed"
          else
            echo "❌ LLM tests failed"
          fi
          
          if [ "$auth_status" == "success" ] && [ "$code_execution_status" == "success" ] && [ "$domain_examples_status" == "success" ] && [ "$llm_status" == "success" ]; then
            exit 0
          else
            exit 1
          fi
