# This workflow runs tests on the src module when relevant files change
# Tests code_execution, connector, example servers, and activity_ui

name: Tests

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:  # Manual trigger anytime
  pull_request:
    paths:
      - 'src/**'
      - 'activity_ui/**'
      - 'examples/**'
      - '.github/workflows/tests.yaml'
    
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history for path checking
          submodules: recursive
      
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          uv sync

      - name: Run code execution tests
        id: code_execution_tests
        continue-on-error: true
        run: |
          uv run pytest src/agora_workbench/code_execution/tests/ -m "not live" -v --json-report --json-report-file=code-execution-report.json

      - name: Run connector tests
        id: connector_tests
        continue-on-error: true
        run: |
          uv run pytest src/agora_workbench/connector/tests/ -m "not live" -v --json-report --json-report-file=connector-report.json

      - name: Run deployment tests
        id: deployment_tests
        continue-on-error: true
        run: |
          uv run pytest src/agora_workbench/deployment/tests/ -m "not live" -v --json-report --json-report-file=deployment-report.json

      - name: Run example servers tests
        id: servers_tests
        continue-on-error: true
        run: |
          uv run pytest examples/servers/tests/ -m "not live" -v --json-report --json-report-file=servers-report.json


      - name: Run activity UI tests
        id: activity_ui_tests
        continue-on-error: true
        run: |
          uv run pytest activity_ui/tests/ -m "not live" -v --json-report --json-report-file=activity-ui-report.json
      
      - name: Test Summary
        if: always()
        run: |
          code_execution_status="${{ steps.code_execution_tests.outcome }}"
          connector_status="${{ steps.connector_tests.outcome }}"
          deployment_status="${{ steps.deployment_tests.outcome }}"
          servers_status="${{ steps.servers_tests.outcome }}"
          activity_ui_status="${{ steps.activity_ui_tests.outcome }}"
          
          echo "## Test Results"
          if [ "$code_execution_status" == "success" ]; then
            echo "✅ Code execution tests passed"
          else
            echo "❌ Code execution tests failed"
          fi

          if [ "$connector_status" == "success" ]; then
            echo "✅ Connector tests passed"
          else
            echo "❌ Connector tests failed"
          fi

          if [ "$deployment_status" == "success" ]; then
            echo "✅ Deployment tests passed"
          else
            echo "❌ Deployment tests failed"
          fi

          if [ "$servers_status" == "success" ]; then
            echo "✅ Example servers tests passed"
          else
            echo "❌ Example servers tests failed"
          fi

          if [ "$activity_ui_status" == "success" ]; then
            echo "✅ Activity UI tests passed"
          else
            echo "❌ Activity UI tests failed"
          fi
          
          if [ "$code_execution_status" == "success" ] && [ "$connector_status" == "success" ] && [ "$deployment_status" == "success" ] && [ "$servers_status" == "success" ] && [ "$activity_ui_status" == "success" ]; then
            exit 0
          else
            exit 1
          fi
