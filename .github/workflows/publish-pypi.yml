name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.1.1)"
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Verify package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match package version $package_version." >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: python .github/scripts/validate_distribution.py

      - name: Smoke-test installed wheel
        run: .github/scripts/smoke_test_wheel.sh

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agora-workbench/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

  docs_plan:
    name: Plan documentation deployment
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aliases: ${{ steps.plan.outputs.aliases }}
      set_latest_default: ${{ steps.plan.outputs.set_latest_default }}
    steps:
      - name: Resolve documentation aliases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: $TAG" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          if ! published=$(gh api "repos/$REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); then
            echo "Could not list the published releases for $REPOSITORY." >&2
            echo "Documentation aliases are resolved by comparing $TAG against every published release," >&2
            echo "so continuing here could move the latest alias onto the wrong version." >&2
            exit 1
          fi

          tags=$(printf '%s\n%s\n' "$published" "$TAG" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -V)

          newest=$(printf '%s\n' "$tags" | tail -n 1)
          newest_in_series=$(printf '%s\n' "$tags" | grep -E "^v${major}\.${minor}\.[0-9]+$" | tail -n 1)

          aliases=""
          set_latest_default=false
          if [[ "$newest_in_series" == "$TAG" ]]; then
            aliases="${major}.${minor}"
          fi
          if [[ "$newest" == "$TAG" ]]; then
            aliases="${aliases:+$aliases }latest"
            set_latest_default=true
          fi

          echo "Deploying documentation for $TAG with aliases: ${aliases:-<none>}"
          echo "aliases=$aliases" >> "$GITHUB_OUTPUT"
          echo "set_latest_default=$set_latest_default" >> "$GITHUB_OUTPUT"

  docs:
    name: Publish documentation
    needs: [build, docs_plan]
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
      aliases: ${{ needs.docs_plan.outputs.aliases }}
      set_latest_default: ${{ needs.docs_plan.outputs.set_latest_default == 'true' }}
