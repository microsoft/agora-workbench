# Weekly dependency component detection via Dependabot

name: Component Detection

on:
  schedule:
    - cron: '30 4 * * 1'  # Every Monday at 04:30 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  component-detection:
    name: Component Detection
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Component Detection
        uses: advanced-security/component-detection-dependency-submission-action@5a8ce4ad8c6fbb9b88f66f672014e44b427d7d54 # v0.0.2
        with:
          directoryExclusionList: '.git,.venv,node_modules'
