# Weekly dependency component detection via Dependabot

name: Component Detection

on:
  schedule:
    - cron: '30 4 * * 1'  # Every Monday at 04:30 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  component-detection:
    name: Component Detection
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Component Detection
        uses: advanced-security/component-detection-dependency-submission-action@v0.0.2
        with:
          directoryExclusionList: '.git,.venv,node_modules'
