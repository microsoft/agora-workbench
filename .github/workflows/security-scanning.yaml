# Keep the dependency graph current for Dependabot alerts.

name: Component Detection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/security-scanning.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'activity_ui/requirements.txt'
      - 'examples/**/pyproject.toml'
  schedule:
    - cron: '30 4 * * 1'  # Every Monday at 04:30 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  component-detection:
    name: Component Detection
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Component Detection
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          directoryExclusionList: '.git,.venv,node_modules'
          detectorArgs: 'UvLock=EnableIfDefaultOff'
