# Weekly security scanning: CodeQL static analysis and dependency component detection

name: Security Scanning

permissions:
  actions: read
  contents: read
  security-events: write

on:
  schedule:
    - cron: '30 4 * * 1'  # Every Monday at 04:30 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  component-detection:
    name: Component Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Component Detection
        uses: advanced-security/component-detection-dependency-submission-action@v0.0.2
        with:
          directoryExclusionList: '.git,.venv,node_modules'
