# MCP Server Registry
#
# Read by utilities.mcp_clients.connect_mcp_servers. Each entry is a server
# the agent host can connect to. Localhost entries use a dev bearer token
# automatically; non-localhost entries use utilities.auth.get_token_provider
# with the entry's scope (or the top-level default).
#
# To restrict which servers a particular run connects to, either pass
# servers=[...] to connect_mcp_servers or set WORKBENCH_SERVERS=name1,name2.

# Default OAuth scope used for non-localhost servers when an entry omits its own.
scope: api://12c90937-013c-468e-93cf-eb8083d69ca7/.default

servers:
  - name: chemistry
    url: http://localhost:8020/mcp
  - name: earthscience
    url: http://localhost:8021/mcp
  - name: energysystems
    url: http://localhost:8022/mcp
