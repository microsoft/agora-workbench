# Example docker-compose for running a CodeExecutionServer locally.
#
# Prerequisites — build the base image first:
#   cd src
#   docker build -f deployment/mcp_server/base.Dockerfile -t mcp-server-base:local .
#
# Then from this directory:
#   docker compose up --build
#
# OPTIONAL — Activity UI observability:
# To see what your agent is doing in this server (executed code, tool calls,
# pushes, etc.), uncomment the three lines marked "[activity-ui]" below and:
#   1) docker network create agora-activity     # once per host
#   2) cd src/activity_ui && docker compose up -d
# Then open http://127.0.0.1:8030 to see live activity.

services:
  my-server:
    build:
      # Directory containing your server code and Dockerfile
      context: .
      dockerfile: Dockerfile
    ports:
      # Maps host port 8000 → container port 8000 (the default server port).
      # Change the left side if you need a different host port.
      - "8000:8000"
    env_file:
      # Loads ENTRA_CLIENT_ID, ENTRA_TENANT_ID, and other config.
      # Copy .env.example from the repo root and fill in your values.
      - .env
    environment:
      # PORT/HOST tell the CodeExecutionServer where to bind inside the container.
      PORT: "8000"
      HOST: "0.0.0.0"
      # [activity-ui] uncomment to publish events to the shared Activity UI:
      # ACTIVITY_UI_URL: "http://activity-ui:8030"
    # [activity-ui] uncomment to join the shared activity network:
    # networks:
    #   - agora-activity
    healthcheck:
      # The base image exposes GET /health — compose uses this to report readiness.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Gives the server time to start before health checks begin failing.
      start_period: 60s

# [activity-ui] uncomment to declare the shared external network:
# networks:
#   agora-activity:
#     external: true
