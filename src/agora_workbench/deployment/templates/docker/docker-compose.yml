# Example docker-compose for running a CodeExecutionServer locally.
#
# Prerequisites — build the base image first (from the repo root):
#   docker build -f deployment/base.Dockerfile -t mcp-server-base:local .
#
# Then from this directory:
#   docker compose up --build
#
# OPTIONAL — Pre-warm the environment cache (builds env + downloads assets):
#   docker compose --profile setup run --rm warm-cache
#   docker compose up
#
# OPTIONAL — Activity UI observability:
# To see what your agent is doing in this server (executed code, tool calls,
# pushes, etc.), uncomment the three lines marked "[activity-ui]" below and:
#   1) docker network create agora-activity     # once per host
#   2) cd activity_ui && docker compose up -d
# Then open http://127.0.0.1:8030 to see live activity.

services:
  my-server:
    build:
      # Directory containing your server code and Dockerfile
      context: .
      dockerfile: Dockerfile
    ports:
      # Maps host port 8000 → container port 8000 (the default server port).
      # Change the left side if you need a different host port.
      - "8000:8000"
    env_file:
      # Loads ENTRA_CLIENT_ID, ENTRA_TENANT_ID, and other config.
      # Copy .env.server.example and fill in your values.
      - ../.env.server
    environment:
      # PORT/HOST tell the CodeExecutionServer where to bind inside the container.
      PORT: "8000"
      HOST: "0.0.0.0"
      # [activity-ui] uncomment to publish events to the shared Activity UI:
      # ACTIVITY_UI_URL: "http://activity-ui:8030"
    volumes:
      # Named volume persists built environments and downloaded assets across
      # container restarts. First startup builds the env; subsequent starts reuse it.
      - env-cache:/home/appuser/.cache/mcp-envs
    # [activity-ui] uncomment to join the shared activity network:
    # networks:
    #   - agora-activity
    healthcheck:
      # The base image exposes GET /health — compose uses this to report readiness.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Gives the server time to start before health checks begin failing.
      start_period: 60s

  # Pre-warm service: builds environment and provisions assets without starting
  # the server. Run with: docker compose --profile setup run --rm warm-cache
  warm-cache:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.server
    volumes:
      - env-cache:/home/appuser/.cache/mcp-envs
    command: ["python", "-m", "agora_workbench.code_execution.cli", "warm", "--config", "/app/my_server/config.yaml", "-v"]

volumes:
  env-cache:

# [activity-ui] uncomment to declare the shared external network:
# networks:
#   agora-activity:
#     external: true
