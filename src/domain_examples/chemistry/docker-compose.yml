# Chemistry MCP Server — local development
#
# Prerequisites — build the base image first:
#   cd src
#   docker build -f deployment/mcp_server/base.Dockerfile -t mcp-server-base:local .
#
# Then from this directory:
#   docker compose up --build

services:
  chemistry-server:
    build:
      context: ../..
      dockerfile: domain_examples/chemistry/Dockerfile
    ports:
      # Bind to localhost by default because this service is unauthenticated.
      # Do not expose it to untrusted networks unless authentication is enabled.
      - "127.0.0.1:8020:8000"
    env_file:
      - ../../../.env
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      # Point at the sidecar in this compose network. Unset → publisher no-ops.
      ACTIVITY_UI_URL: "http://activity-ui:8030"
    depends_on:
      - activity-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  activity-ui:
    build:
      context: ../..
      dockerfile: activity_ui/Dockerfile
    ports:
      # Bind to localhost; dev-only observability, no auth yet.
      - "127.0.0.1:8030:8030"
    environment:
      ACTIVITY_UI_HOST: "0.0.0.0"
      ACTIVITY_UI_PORT: "8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/healthz').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
