# For small standalone operations (audit artifact registry,
# patch Purview metadata) without running the full pipeline:
#
#   uv run -m data_lake.manifest.run_manifest data_lake/manifest/demo_manifest.yaml
#   uv run -m data_lake.manifest.run_manifest data_lake/manifest/demo_manifest.yaml --dry-run

version: "1"
purview_account: "agora-purview"

# Query the artifact registry and write a JSON snapshot
registry_query:
  search_service: "agora-ai-search"
  index_name: "artifact-registry"
  filter_expression: "domain eq 'powergrid'"
  top: 25
  select_fields:
    - "artifact_id"
    - "name"
    - "domain"
    - "artifact_type"
  output_path: "analysis/powergrid_registry_snapshot.json"

# Batch Purview metadata updates
entity_updates:
  - qualified_name: "https://coienergydata.blob.core.windows.net/energydata/US_Elec_Transmission_Line/"
    new_description: >
      Folder-level semantic description for U.S. transmission line data artifacts, including geographic coordinates

