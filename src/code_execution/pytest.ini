# Pytest configuration for code execution tests

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test support
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    live: marks tests that require a live server (deselect with '-m "not live"')

# Timeout settings (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Coverage settings (if using pytest-cov)
# [coverage:run]
# source = code_execution
# omit = 
#     */tests/*
#     */conftest.py

# Logging
log_cli = false
log_cli_level = INFO
