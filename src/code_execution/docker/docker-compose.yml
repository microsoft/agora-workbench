# ---------------------------------------------------------------------------
# YAML anchors (Docker Compose extension fields — ignored by compose itself,
# used here purely to DRY up repeated blocks).
# ---------------------------------------------------------------------------

x-common-build: &common-build
  context: ../..
  dockerfile: code_execution/docker/Dockerfile
  additional_contexts:
    azure-cli: ~/.azure

x-base-env: &base-env
  PORT: "8000"
  HOST: "0.0.0.0"
  OBO_SIMULATION_MODE: "true"

# Populated by `build.py generate` once domains are added.
# List all server service names that participate in object-transfer.
x-trusted-hosts: &trusted-hosts
  OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS: ""

x-common-healthcheck: &common-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

# Domain services are added here by `build.py generate` or manually following
# the pattern in README.md.  Use the anchors above to avoid boilerplate:
#
#   my-server:
#     build:
#       <<: *common-build
#       target: my-server
#     command: ["python", "-m", "domains.myserver.server.myserver_server"]
#     ports:
#       - "8000:8000"
#     volumes:
#       - ~/.azure:/root/.azure:rw
#     env_file:
#       - ../../.env
#     environment:
#       <<: [*base-env, *trusted-hosts]
#     healthcheck:
#       <<: *common-healthcheck

services: {}
