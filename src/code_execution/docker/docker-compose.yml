  vitrimer-tg-sim-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: vitrimer-tg-sim-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.vitrimer_tg_sim.server.vitrimer_tg_sim_server" ]
    ports:
      - "8010:8000"
    volumes:
      - ~/.azure:/root/.azure:rw
    env_file:
      - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - LAMMPS_CMD=lmp
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu,vitrimer-tg-sim-server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 32g

  vitrimer-vae-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: vitrimer-vae-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.vitrimer_vae.server.vitrimer_vae_server" ]
    ports:
      - "8011:8000"
    volumes:
      - ~/.azure:/root/.azure:rw
    env_file:
      - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - VITRIMER_VAE_CHECKPOINT_URL=https://sorbent0eastus.blob.core.windows.net/vitrimervae-checkpoints/prop49.model
      - VITRIMER_VAE_CHECKPOINT_SHA256=725b4cfa60a9a6858b79298907cdf1fd4566d704a007d1cb966a1098b0f05033
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu,vitrimer-tg-sim-server,vitrimer-vae-server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openlca-data:
