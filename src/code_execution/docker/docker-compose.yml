services:
  example-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: example-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.example.server.example_server" ]
    ports:
    - 8000:8000
    volumes:
      - ~/.azure:/root/.azure:rw # rw needed: Azure CLI refreshes token cache
    env_file:
    - ../../.env
    environment:
    - PORT=8000
    - HOST=0.0.0.0
    - OBO_SIMULATION_MODE=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  powergrid-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: powergrid-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.powergrid.server.powergrid_server" ]
    ports:
    - 8001:8000
    volumes:
    - ~/.azure:/root/.azure:rw
    env_file:
    - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
      # Clear stale venvs on restart so the custom GPU-enabled highspy wheel
      # (built from source with CUPDLP_GPU=ON) is always cleanly installed.
      # Without this, a leftover/broken venv may keep a CPU-only highspy or
      # cause uv venv creation to fail on a non-empty directory.
      - UV_VENV_CLEAR=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  powergrid-server-cpu:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: powergrid-server-cpu
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.powergrid.server.powergrid_server" ]
    ports:
      - "8005:8000"
    volumes:
    - ~/.azure:/root/.azure:rw
    env_file:
    - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  process-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: process-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.process.server.process_server" ]
    ports:
    - 8002:8000
    volumes:
    - ~/.azure:/root/.azure:rw
    env_file:
    - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  foundry-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: foundry-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.foundry.server.foundry_server" ]
    ports:
    - 8003:8000
    volumes:
    - ~/.azure:/root/.azure:rw
    env_file:
    - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gis-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: gis-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.gis.server.gis_server" ]
    ports:
      - "8006:8000"
    volumes:
      - ~/.azure:/root/.azure:rw
      - ../../maps:/tmp/maps:rw
    env_file:
      - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openlca-ipc:
    build:
      context: ../../domains/openlca/docker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - openlca-data:/app/data

  openlca-server:
    build:
      context: ../..
      dockerfile: code_execution/docker/Dockerfile
      target: openlca-server
      additional_contexts:
        azure-cli: ~/.azure
    command: [ "python", "-m", "domains.openlca.server.openlca_server" ]
    ports:
      - "8008:8000"
    volumes:
      - ~/.azure:/root/.azure:rw
    env_file:
      - ../../.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OBO_SIMULATION_MODE=true
      - OLCA_IPC_HOST=openlca-ipc
      - OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS=powergrid-server,gis-server,process-server,foundry-server,office-server,openlca-server,powergrid-server-cpu
    depends_on:
      - openlca-ipc
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  office-server:
