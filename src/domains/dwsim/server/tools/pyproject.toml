[project]
name = "dwsim-tools"
version = "0.1.0"
description = "DWSIM chemical process simulation tools for AgoraAgentMAF code execution server"
requires-python = ">=3.10"
dependencies = [
    "pythonnet==3.0.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
