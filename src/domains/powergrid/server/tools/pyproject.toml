[project]
name = "pypsa-powergrid-tools"
version = "0.1.0"
description = "PyPSA power grid tools for AgoraAgentMAF code execution server"
requires-python = ">=3.11"
dependencies = [
    "pypsa==0.30.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
