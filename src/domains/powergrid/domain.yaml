# The powergrid domain uses a complex multi-stage GPU build (HiGHS + CUDA) and
# a CPU-only variant. Both stages are kept as special cases in base.Dockerfile
# rather than rendered from domain.Dockerfile.j2.
#
# Set `dockerfile_fragment: Dockerfile.fragment` here so that `build.py generate`
# includes the powergrid stages from that file.  The fragment must be created
# by the domain team and placed at domains/powergrid/Dockerfile.fragment.
#
# Until the fragment exists the powergrid stages in base.Dockerfile serve as
# the authoritative source.
name: powergrid
module: domains.powergrid.server.powergrid_server
port: 8001
description: Power grid optimization (PyPSA, GPU-enabled HiGHS)
system_packages: []
extra_files:
  - states.py
extra_env:
  UV_VENV_CLEAR: "1"
depends_on: []
volumes: []
trusted_hosts: true
gpu: true
dockerfile_fragment: Dockerfile.fragment
