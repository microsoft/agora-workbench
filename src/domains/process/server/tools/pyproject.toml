[project]
name = "idaes-process-tools"
version = "0.1.0"
description = "IDAES process simulation tools for AgoraAgentMAF code execution server"
requires-python = ">=3.11"
dependencies = [
    "idaes-pse>=2.5.0",
    "pyomo>=6.7.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
