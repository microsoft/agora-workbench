name: process
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # Process simulation frameworks
  - pyomo>=6.7.0
  - idaes-pse>=2.5.0

  # Solver (prebuilt via conda-forge)
  - ipopt

  # Scientific computing
  - numpy>=1.26.0
  - pandas>=2.2.2
  - scipy>=1.11.3

  # Chemical property databases
  - chemicals>=1.1.0
  - thermo>=0.3.0

  # Additional utilities
  - dill>=0.3.8
  - pydantic>=2.0.0
  - typeguard>=4.0.0
  - tqdm>=4.66.0

  # Install local tools package into the env
  - pip:
      - /app/domains/process/server/tools
