# Domain Registry Configuration
#
# Maps MCP server names to their domain-specific metadata:
# - tool_registry_module/function: Python module + factory for the domain's ToolRegistry
# - domain_prompt_path: Jinja template with domain-specific LLM instructions
#
# This file is SEPARATE from server_registry.yaml intentionally.
# server_registry.yaml owns MCP transport config (url, port, scope).
# This file owns domain-level concerns (tool registries, prompts).
#
# Loaded by domains/domain_registry.py

domains:
  example:
    tool_registry_module: domains.example.server.tool_registry
    tool_registry_function: create_example_tool_registry
    domain_prompt_path: domains/example/domain_prompt/example.jinja
  powergrid:
    tool_registry_module: domains.powergrid.server.tool_registry
    tool_registry_function: create_powergrid_tool_registry
    domain_prompt_path: domains/powergrid/domain_prompt/powergrid.jinja
  process:
    tool_registry_module: domains.process.server.tool_registry
    tool_registry_function: create_process_tool_registry
  foundry:
    tool_registry_module: domains.foundry.server.tool_registry
    tool_registry_function: create_foundry_tool_registry
    domain_prompt_path: domains/foundry/domain_prompt/foundry.jinja
  gis:
    domain_prompt_path: domains/gis/domain_prompt/gis.jinja
  dwsim:
    tool_registry_module: domains.dwsim.server.tool_registry
    tool_registry_function: create_dwsim_tool_registry
  openlca:
    tool_registry_module: domains.openlca.server.tool_registry
    tool_registry_function: create_openlca_tool_registry
    domain_prompt_path: domains/openlca/domain_prompt/openlca.jinja
  vitrimer_tg_sim:
    tool_registry_module: domains.vitrimer_tg_sim.server.tool_registry
    tool_registry_function: create_vitrimer_tg_sim_tool_registry
  office:
    tool_registry_module: domains.office.server.tool_registry
    tool_registry_function: create_office_tool_registry
