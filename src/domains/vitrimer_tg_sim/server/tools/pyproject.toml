[project]
name = "vitrimer-tg-sim-tools"
version = "0.1.0"
description = "Domain tools for vitrimer Tg estimation via MD simulation (EMC + LAMMPS + PCFF)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.2,<3.0",
    "scipy>=1.11.3",
    "pwlf>=2.0.0",
    "rdkit>=2023.3.1",
    "emc-pypi>=2025.8.21",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
