name: openlca
module: domains.openlca.server.openlca_server
port: 8008
description: Life cycle assessment (pure-Python olca-ipc client; IPC server is a sidecar)
system_packages: []
extra_files:
  - __init__.py
  - states.py
extra_env:
  OLCA_IPC_HOST: openlca-ipc
depends_on:
  - openlca-ipc
volumes: []
trusted_hosts: true
sidecar_services:
  openlca-ipc:
    build:
      context: ../../domains/openlca/docker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - openlca-data:/app/data
