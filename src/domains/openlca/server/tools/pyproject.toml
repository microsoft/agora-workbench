[project]
name = "openlca-tools"
version = "0.1.0"
description = "OpenLCA tools for AgoraAgentMAF life cycle assessment code execution server"
requires-python = ">=3.11"
dependencies = [
    "olca-ipc>=2.0.0",
    "olca-schema>=0.0.12",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
