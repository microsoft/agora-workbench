[project]
name = "agora-agent"
version = "0.1.0"
description = "A multi-domain AI agent system that combines LLM-driven workflows with isolated code execution environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-purview-catalog>=1.0.0b4",
    "azure-purview-administration>=1.0.0b1",
    "azure-purview-scanning>=1.0.0b2",
    "azure-search-documents>=11.6.0",
    "azure-storage-blob[aio]>=12.28.0",
    "dill>=0.3.8",
    "fastapi>=0.115",
    "fastmcp>=2.14.2",
    "ipykernel>=6.29.0",
    "jinja2>=3.1.6",
    "mcp>=1.26.0",
    "openai>=1.107.3",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.10.4",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.1.1",
    "rasterio>=1.4.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
    "titiler.core>=0.19.0",
    "typeguard>=4.4.4",
    "azure-data-tables>=12.7.0",
    "uvicorn>=0.34",
    "wsproto>=1.3.2",
]

[project.optional-dependencies]
maf = ["agent-framework>=1.2.0"]

[project.urls]
homepage = "https://github.com/msr-central/agora-agent"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tools*", "data_lake*", "middleware*", "auth*", "planning*", "gui*"]
exclude = ["tests*", "scripts*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["src/auth/tests", "src/tools/tests", "src/data_lake/tests", "src/middleware/tests", "src/planning/tests"]
addopts = '-m "not live"'
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, mocked dependencies)",
    "integration: Integration tests (mocked dependencies)",
    "live: Live tests (require real API calls, credentials, network)",
    "asyncio: Async tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
