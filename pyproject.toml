[project]
name = "agora-agent"
version = "0.1.0"
description = "A multi-domain AI agent system that combines LLM-driven workflows with isolated code execution environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Azure SDKs
    "azure-core>=1.38.0",
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.25.0",
    "azure-search-documents>=11.4.0",
    "azure-storage-blob[aio]>=12.28.0",
    # MCP / Web
    "fastapi>=0.115",
    "fastmcp>=2.14.2",
    "mcp>=1.26.0",
    "starlette>=0.41.0",
    "uvicorn>=0.34",
    "wsproto>=1.3.2",
    # Auth
    "cryptography>=43.0.0",
    "msal>=1.28.0",
    "pyjwt[crypto]>=2.8.0",
    # Data
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.10.4",
    "pyyaml>=6.0",
    # Execution & Sessions
    "dill>=0.3.8",
    "ipykernel>=6.29.0",
    "jupyter-client>=8.6.0",
    "pyzmq>=26.0.0",
    "sqlite-vec>=0.1.9",
    # HTTP & Networking
    "httpx>=0.27.0",
    "sse-starlette>=3.3.0",
    # Utilities
    "typeguard>=4.4.4",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
# Agent-side helpers (LLM factories, MCP clients)
agent = [
    "agent-framework>=1.2.0",
    "openai>=1.107.3",
    "python-dotenv>=1.1.1",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
]
# OpenAI Agents SDK adapter (docs/tutorials/openai_agents_quickstart)
openai-agents = [
    "openai-agents>=0.15.0",
]
# GitHub Copilot SDK adapter (docs/tutorials/copilot_sdk_quickstart)
copilot-sdk = [
    "github-copilot-sdk>=0.3.0",
    "python-dotenv>=1.1.1",
]
# Domain-specific (geospatial examples)
geo = [
    "rasterio>=1.4.0",
    "titiler.core>=0.19.0",
]

[project.urls]
homepage = "https://github.com/msr-central/agora-agent"

[project.scripts]
mcp-connector-server = "connector.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["base*", "code_execution*", "connector*", "agent_helpers*", "activity_ui*"]
exclude = ["tests*", "scripts*", "examples*", "deployment*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.12",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "griffelib>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["src/code_execution/tests", "src/connector/tests", "examples/domain_examples/tests", "agent_helpers/llm/tests", "agent_helpers/tests", "activity_ui/tests"]
addopts = '-m "not live"'
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, mocked dependencies)",
    "integration: Integration tests (mocked dependencies)",
    "live: Live tests (require real API calls, credentials, network)",
    "asyncio: Async tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 300

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
