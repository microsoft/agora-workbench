site_name: Agora Workbench
site_description: Documentation for building sandboxed MCP servers with Agora Workbench.
repo_url: https://github.com/microsoft/agora-workbench

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home:
      - index.md
      - Core concepts: guide/concepts.md
      - Options for making a CodeExecutionServer: guide/server-options.md
      - CodeExecutionServer tool pattern: guide/tool-pattern.md
      - CodeExecutionServer skill pattern: guide/skill-pattern.md
      - Writing effective tools and skills: guide/writing-effective-tools.md
  - Other options:
      - Attaching to your agent: guide/attaching-to-your-agent.md
      - Working with data: guide/working-with-data.md
      - Sidecars (shared helper processes): guide/sidecars.md
      - Server networks with ConnectorServer: guide/server-networks.md
      - Deploying your server: guide/deploying.md
      - Monitoring your servers: guide/monitoring.md
      - Authentication options: guide/authentication.md
      - Extension points: guide/extension-points.md
  - Tutorials:
      - Start the chemistry MCP server: tutorials/start-chemistry-server.md
      - Your First Server: tutorials/first_server/README.md
      - Microsoft Agent Framework: tutorials/maf_connect/README.md
      - OpenAI Agents SDK: tutorials/openai_agents_connect/README.md
      - GitHub Copilot SDK: tutorials/copilot_sdk_connect/README.md
  - API Reference:
      - Server: api/server.md
      - Models: api/models.md
      - Sessions: api/sessions.md
      - Tool Registry: api/tool_registry.md
      - Data Access: api/data_access.md
      - Auth: api/auth.md
