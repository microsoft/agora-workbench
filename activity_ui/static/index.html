<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agora Activity</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        margin: 0;
        background: #0d1117;
        color: #c9d1d9;
      }
      header {
        position: sticky;
        top: 0;
        background: #0d1117;
        border-bottom: 1px solid #30363d;
        padding: 12px 20px;
        z-index: 10;
      }
      .titlebar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 16px; margin: 0; }
      .conn {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        background: #21262d;
        color: #8b949e;
      }
      .conn.live { background: #1f6feb33; color: #79c0ff; }
      .conn.live::before { content: "● "; color: #56d364; }
      .conn.down { background: #f8514922; color: #f85149; }
      .conn.down::before { content: "● "; }
      .stats { color: #6e7681; font-size: 11px; margin-left: auto; }
      .filters { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .filter-label { color: #6e7681; font-size: 11px; margin-right: 4px; }
      .chip {
        font: inherit;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid #30363d;
        background: transparent;
        color: #8b949e;
        cursor: pointer;
      }
      .chip:hover { border-color: #58a6ff; color: #c9d1d9; }
      .chip.on {
        background: #1f6feb33;
        color: #79c0ff;
        border-color: #1f6feb;
      }
      main { padding: 16px 20px 60px; }
      .session {
        border: 1px solid #30363d;
        border-radius: 6px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .session-header {
        background: #161b22;
        padding: 8px 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .session-header:hover { background: #1c2229; }
      .caret { color: #58a6ff; font-size: 10px; width: 10px; }
      .session-id { color: #d2a8ff; }
      .session-meta { color: #6e7681; font-size: 11px; margin-left: auto; }
      .session-body { display: block; }
      .session.collapsed .session-body { display: none; }
      .session.collapsed .caret { transform: rotate(-90deg); display: inline-block; }
      .event {
        border-top: 1px solid #21262d;
        padding: 8px 12px;
      }
      .event:first-child { border-top: none; }
      .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
      .badge {
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 11px;
        background: #1f6feb33;
        color: #79c0ff;
        white-space: nowrap;
      }
      .badge.code_executed, .badge.code_failed { background: #1f6feb33; color: #79c0ff; }
      .badge.job_started, .badge.job_finished { background: #ffa65733; color: #ffa657; }
      .badge.push_object_sent, .badge.push_object_received { background: #56d36433; color: #56d364; }
      .badge.tool_search, .badge.skill_loaded, .badge.workflow_planned { background: #d2a8ff22; color: #d2a8ff; }
      .badge.data_searched { background: #39c5cf22; color: #39c5cf; }
      .badge.batch_cancelled { background: #f8514922; color: #f85149; }
      .badge.artifact_published { background: #56d36433; color: #56d364; }
      .orch-chip {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        margin: 2px 4px 0 0;
        border-radius: 3px;
        background: #21262d;
        color: #d2a8ff;
      }
      .orch-chip.skill { color: #ffa657; }
      .kv { color: #6e7681; font-size: 11px; margin-top: 2px; }
      .kv span { margin-right: 10px; }
      .kv b { color: #c9d1d9; font-weight: normal; }
      .tool-name {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        margin: 2px 4px 0 0;
        border-radius: 3px;
        background: #21262d;
        color: #c9d1d9;
      }
      .batch-tag { color: #ffa657; font-size: 11px; }
      .tool-calls {
        margin-top: 6px;
        border-left: 2px solid #30363d;
        padding-left: 8px;
      }
      .displays {
        margin-top: 6px;
        border-left: 2px solid #d2a8ff44;
        padding-left: 8px;
      }
      .displays-label {
        color: #6e7681;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .display-figure {
        margin: 4px 0;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 4px;
        padding: 6px;
        display: inline-block;
        max-width: 100%;
      }
      .display-figure img,
      .display-figure svg {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .display-figure .mime-badge {
        color: #6e7681;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .tool-calls-label {
        color: #6e7681;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .tool-call {
        font-size: 12px;
        padding: 2px 0;
        cursor: pointer;
        line-height: 1.4;
      }
      .tool-call:hover { background: #161b22; }
      .tool-call .mark { width: 14px; display: inline-block; text-align: center; }
      .tool-call .tname { color: #79c0ff; }
      .tool-call .targs { color: #8b949e; }
      .tool-call .tdur { color: #6e7681; font-size: 10px; margin-left: 6px; }
      .tool-call .terror { color: #f85149; margin-left: 6px; }
      .tool-call-detail {
        display: none;
        margin: 4px 0 4px 14px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 3px;
        padding: 6px 8px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tool-call.open .tool-call-detail { display: block; }
      .artifacts { margin-top: 4px; }
      .artifacts-label { color: #56d364; font-size: 11px; }
      .artifact-row { padding: 2px 0 2px 14px; font-size: 12px; line-height: 1.4; }
      .artifact-link { color: #79c0ff; text-decoration: none; }
      .artifact-link:hover { text-decoration: underline; }
      .artifact-meta { color: #6e7681; font-size: 10px; }
      .save-hint {
        margin-top: 4px;
        padding: 3px 8px;
        font-size: 11px;
        color: #d29922;
        background: #d2992216;
        border-left: 2px solid #d29922;
        border-radius: 2px;
      }
      .save-dl {
        color: #d29922;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid #d29922;
        border-radius: 3px;
        padding: 0 5px;
      }
      .save-dl:hover { background: #d2992233; }
      .server { color: #d2a8ff; font-size: 11px; }
      .ts { color: #6e7681; font-size: 11px; margin-left: auto; }
      .desc { margin-top: 3px; color: #c9d1d9; }
      details { margin-top: 4px; }
      summary { cursor: pointer; color: #58a6ff; font-size: 11px; }
      pre {
        background: #161b22;
        border: 1px solid #30363d;
        padding: 8px;
        margin: 4px 0 0;
        overflow-x: auto;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .empty { color: #6e7681; font-style: italic; padding: 40px 0; text-align: center; }
      .ok { color: #56d364; }
      .fail { color: #f85149; }
      .toolbar-btn {
        font: inherit;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid #30363d;
        background: transparent;
        color: #8b949e;
        cursor: pointer;
        margin-left: 4px;
      }
      .toolbar-btn:hover { color: #c9d1d9; border-color: #58a6ff; }
    </style>
  </head>
  <body>
    <header>
      <div class="titlebar">
        <h1>Agora Activity</h1>
        <span id="conn" class="conn">connecting…</span>
        <span class="stats" id="stats"></span>
        <button class="toolbar-btn" id="clear-btn" title="Clear local view (server buffer is unaffected)">clear</button>
      </div>
      <div class="filters">
        <span class="filter-label">servers</span>
        <span id="server-chips"></span>
        <span class="filter-label" style="margin-left:12px;">types</span>
        <span id="type-chips"></span>
      </div>
    </header>
    <main>
      <div id="feed">
        <div class="empty">Waiting for events…</div>
      </div>
    </main>

    <script>
      const TYPE_GROUPS = {
        exec:  ["code_executed", "code_failed"],
        job:   ["job_started", "job_finished", "batch_cancelled"],
        orch:  ["tool_search", "data_searched", "skill_loaded", "workflow_planned"],
        push:  ["push_object_sent", "push_object_received"],
        artifact: ["artifact_published"],
      };
      const TYPE_TO_GROUP = {};
      for (const [g, types] of Object.entries(TYPE_GROUPS)) {
        for (const t of types) TYPE_TO_GROUP[t] = g;
      }

      // All events, in arrival order. Re-rendered in full on filter change.
      const events = [];
      // Filter state: empty Set = show all.
      const filterServers = new Set();
      const filterTypeGroups = new Set();
      const collapsedSessions = new Set();
      const seenServers = new Set();
      // Event ids already rendered, so buffer replays / SSE reconnects don't
      // re-append the same events (see ingest() and the /events/recent loop).
      const seenIds = new Set();

      const feed = document.getElementById("feed");
      const conn = document.getElementById("conn");
      const stats = document.getElementById("stats");
      const serverChipsEl = document.getElementById("server-chips");
      const typeChipsEl = document.getElementById("type-chips");

      function fmtTs(t) {
        return new Date(t * 1000).toLocaleTimeString();
      }

      function visible(e) {
        if (filterServers.size && !filterServers.has(e.server)) return false;
        const g = TYPE_TO_GROUP[e.type];
        if (filterTypeGroups.size && (!g || !filterTypeGroups.has(g))) return false;
        return true;
      }

      function renderTypeChips() {
        typeChipsEl.innerHTML = "";
        for (const g of Object.keys(TYPE_GROUPS)) {
          const b = document.createElement("button");
          b.className = "chip" + (filterTypeGroups.has(g) ? " on" : "");
          b.textContent = g;
          b.onclick = () => {
            if (filterTypeGroups.has(g)) filterTypeGroups.delete(g);
            else filterTypeGroups.add(g);
            renderTypeChips();
            renderFeed();
          };
          typeChipsEl.appendChild(b);
        }
      }

      function renderServerChips() {
        serverChipsEl.innerHTML = "";
        const sorted = [...seenServers].sort();
        if (sorted.length === 0) {
          const span = document.createElement("span");
          span.className = "filter-label";
          span.textContent = "(none yet)";
          serverChipsEl.appendChild(span);
          return;
        }
        for (const s of sorted) {
          const b = document.createElement("button");
          b.className = "chip" + (filterServers.has(s) ? " on" : "");
          b.textContent = s;
          b.onclick = () => {
            if (filterServers.has(s)) filterServers.delete(s);
            else filterServers.add(s);
            renderServerChips();
            renderFeed();
          };
          serverChipsEl.appendChild(b);
        }
      }

      function fmtArgsInline(args) {
        if (!args || typeof args !== "object") return "";
        const parts = [];
        for (const [k, v] of Object.entries(args)) {
          let rendered;
          if (typeof v === "string") {
            rendered = `"${v.length > 40 ? v.slice(0, 40) + "…" : v}"`;
          } else if (Array.isArray(v)) {
            rendered = `[${v.length}]`;
          } else if (v === null) {
            rendered = "null";
          } else if (typeof v === "object") {
            rendered = "{…}";
          } else {
            rendered = String(v);
          }
          parts.push(`${k}=${rendered}`);
        }
        const joined = parts.join(", ");
        return joined.length > 90 ? joined.slice(0, 90) + "…" : joined;
      }

      // Build a span with class + text in one shot.  We use this everywhere
      // a server-controlled string would otherwise be interpolated into
      // innerHTML.  textContent is the safe sink — it never parses HTML.
      function span(className, text) {
        const el = document.createElement("span");
        el.className = className;
        el.textContent = text;
        return el;
      }

      function buildToolCallRow(tc) {
        const row = document.createElement("div");
        row.className = "tool-call";
        const ok = tc.success !== false;
        row.appendChild(span("mark " + (ok ? "ok" : "fail"), ok ? "✓" : "✗"));
        row.appendChild(document.createTextNode(" "));
        row.appendChild(span("tname", tc.tool_name || "?"));
        row.appendChild(span("targs", "(" + fmtArgsInline(tc.args) + ")"));
        if (typeof tc.duration_ms === "number") {
          row.appendChild(span("tdur", tc.duration_ms.toFixed(2) + "ms"));
        }
        if (tc.error) {
          row.appendChild(span("terror", tc.error));
        }

        const detail = document.createElement("div");
        detail.className = "tool-call-detail";
        const payload = { args: tc.args };
        if (tc.result !== undefined) payload.result = tc.result;
        if (tc.error) payload.error = tc.error;
        detail.textContent = JSON.stringify(payload, null, 2);
        row.appendChild(detail);

        row.onclick = () => row.classList.toggle("open");
        return row;
      }

      function buildEventEl(e) {
        const wrap = document.createElement("div");
        wrap.className = "event";

        const row = document.createElement("div");
        row.className = "row";
        row.appendChild(span("badge " + (e.type || ""), e.type || ""));
        row.appendChild(span("server", e.server || "?"));
        if (typeof e.success === "boolean") {
          row.appendChild(span(e.success ? "ok" : "fail", e.success ? "✓" : "✗"));
        }
        if (e.batch_id) {
          row.appendChild(span("batch-tag", "batch " + e.batch_id));
        }
        row.appendChild(span("ts", fmtTs(e.timestamp)));
        wrap.appendChild(row);

        if (e.description) {
          const d = document.createElement("div");
          d.className = "desc";
          d.textContent = e.description;
          wrap.appendChild(d);
        }

        // tool_search: show the query and matched tool/skill names inline.
        if (e.type === "tool_search") {
          const matched = [
            ...(Array.isArray(e.matched_tools) ? e.matched_tools : []),
            ...(Array.isArray(e.matched_skills) ? e.matched_skills : []),
          ];
          if (matched.length) {
            const list = document.createElement("div");
            list.style.marginTop = "4px";
            for (const name of matched) {
              const chip = document.createElement("span");
              chip.className = "orch-chip" + ((e.matched_skills || []).includes(name) ? " skill" : "");
              chip.textContent = name;
              list.appendChild(chip);
            }
            wrap.appendChild(list);
          }
        }

        // data_searched: show the matched dataset names inline.
        if (e.type === "data_searched") {
          const matched = Array.isArray(e.matched_artifacts) ? e.matched_artifacts : [];
          if (matched.length) {
            const list = document.createElement("div");
            list.style.marginTop = "4px";
            for (const name of matched) {
              const chip = document.createElement("span");
              chip.className = "orch-chip";
              chip.textContent = name;
              list.appendChild(chip);
            }
            wrap.appendChild(list);
          }
        }

        // workflow_planned: show domain/mode/transition inline.
        if (e.type === "workflow_planned") {
          const kv = document.createElement("div");
          kv.className = "kv";
          // Each part = a <span> holding "label " + <b>value</b>.  Built
          // with DOM nodes so values can't inject markup.
          const addPart = (labelText, value) => {
            const s = document.createElement("span");
            if (labelText) s.appendChild(document.createTextNode(labelText + " "));
            const b = document.createElement("b");
            b.textContent = value;
            s.appendChild(b);
            kv.appendChild(s);
          };
          let any = false;
          if (e.mode) { addPart("mode", e.mode); any = true; }
          if (e.domain) { addPart("domain", e.domain); any = true; }
          if (e.current_state || e.target_state) {
            const s = document.createElement("span");
            const b1 = document.createElement("b");
            b1.textContent = e.current_state || "?";
            s.appendChild(b1);
            s.appendChild(document.createTextNode(" → "));
            const b2 = document.createElement("b");
            b2.textContent = e.target_state || "?";
            s.appendChild(b2);
            kv.appendChild(s);
            any = true;
          }
          if (e.tool_name) { addPart("tool", e.tool_name); any = true; }
          if (any) wrap.appendChild(kv);
        }

        // artifact_published: a file pushed to a publisher destination.  On
        // success, surface the remote URI as a download link (for http(s)
        // <gui>/<blob> destinations) or plain text (for <local> filesystem
        // paths).  The error case is covered by the generic `error` disclosure.
        if (e.type === "artifact_published" && e.success !== false && e.remote_uri) {
          wrap.appendChild(buildPublishedArtifactEl(e));
        }

        // tool_calls: promoted to a first-class lane (this is the headline content for "what did the agent do").
        if (Array.isArray(e.tool_calls) && e.tool_calls.length) {
          const lane = document.createElement("div");
          lane.className = "tool-calls";
          const lbl = document.createElement("div");
          lbl.className = "tool-calls-label";
          lbl.textContent = `tool calls (${e.tool_calls.length})`;
          lane.appendChild(lbl);
          for (const tc of e.tool_calls) {
            lane.appendChild(buildToolCallRow(tc));
          }
          wrap.appendChild(lane);
        }

        const expandable = ["code", "stdout", "stderr", "error"];
        for (const k of expandable) {
          const v = e[k];
          if (v === null || v === undefined) continue;
          if (typeof v === "string" && v === "") continue;
          if (Array.isArray(v) && v.length === 0) continue;
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = k;
          det.appendChild(sum);
          const pre = document.createElement("pre");
          pre.textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2);
          det.appendChild(pre);
          wrap.appendChild(det);
        }

        if (Array.isArray(e.displays) && e.displays.length) {
          const det = document.createElement("details");
          det.className = "displays";
          const sum = document.createElement("summary");
          sum.className = "displays-label";
          sum.textContent = `figures (${e.displays.length})`;
          det.appendChild(sum);
          for (const d of e.displays) {
            det.appendChild(buildDisplayEl(d));
          }
          wrap.appendChild(det);
        }

        // artifacts: files written under the session's outputs dir during
        // this execute, surfaced as download links.  Collapsed by default
        // to match the figures/displays pattern.
        if (Array.isArray(e.artifacts) && e.artifacts.length) {
          const det = document.createElement("details");
          det.className = "artifacts";
          const sum = document.createElement("summary");
          sum.className = "artifacts-label";
          sum.textContent = `artifacts (${e.artifacts.length})`;
          det.appendChild(sum);
          for (const a of e.artifacts) {
            det.appendChild(buildArtifactRow(a));
          }
          wrap.appendChild(det);
        }

        // saved_files: files written to the outputs dir this run.  Each gets a
        // reminder line with a direct download button (token capability URL) and
        // a pointer to ask the agent to publish for a shareable link.  Names via
        // textContent and the URL via .href — neither parses HTML.
        if (Array.isArray(e.saved_files) && e.saved_files.length) {
          for (const f of e.saved_files) {
            const hint = document.createElement("div");
            hint.className = "save-hint";
            hint.appendChild(document.createTextNode(`💾 saved ${f.name || "(unnamed)"} — `));
            if (f.download_url) {
              const dl = document.createElement("a");
              dl.className = "save-dl";
              dl.href = f.download_url;
              dl.setAttribute("download", f.name || "");
              dl.setAttribute("rel", "noopener noreferrer");
              dl.textContent = "⬇ download";
              hint.appendChild(dl);
            }
            hint.appendChild(document.createTextNode(" · or ask the agent to publish it to share"));
            wrap.appendChild(hint);
          }
        }

        return wrap;
      }

      // Render one rich-output entry from a code_executed event's `displays`.
      // Supported MIME types: image/png (base64), image/svg+xml (raw XML).
      // Anything else falls back to a small placeholder so unhandled payloads
      // are still visible.
      //
      // Security: both PNG and SVG are rendered via `<img>` data URLs.  For
      // SVG, this puts the browser into "secure static mode" — scripts and
      // event handlers inside the SVG are disabled, external fetches are
      // blocked.  Do NOT switch SVG to innerHTML/DOMParser; kernel code is
      // LLM-generated and prompt-injectable.
      function buildDisplayEl(d) {
        const fig = document.createElement("div");
        fig.className = "display-figure";
        const badge = document.createElement("div");
        badge.className = "mime-badge";
        badge.textContent = d.mime_type || "(unknown)";
        fig.appendChild(badge);

        if (d.mime_type === "image/png" && typeof d.data === "string") {
          const img = document.createElement("img");
          img.alt = "kernel output (image/png)";
          img.src = `data:image/png;base64,${d.data}`;
          fig.appendChild(img);
        } else if (d.mime_type === "image/svg+xml" && typeof d.data === "string") {
          const img = document.createElement("img");
          img.alt = "kernel output (image/svg+xml)";
          // btoa() needs latin-1; encode UTF-8 first so non-ASCII text in
          // the SVG (axis labels, titles) survives the round-trip.
          img.src = "data:image/svg+xml;base64," +
            btoa(unescape(encodeURIComponent(d.data)));
          fig.appendChild(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "mime-badge";
          placeholder.textContent = `(payload not rendered: ${d.mime_type || "no MIME"})`;
          fig.appendChild(placeholder);
        }
        return fig;
      }

      // Format a byte count as a short human-readable string.
      function fmtBytes(n) {
        if (typeof n !== "number" || n < 0) return "";
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
        return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
      }

      // Render one entry from a code_executed event's `artifacts`.  Each
      // row is a download link (cross-origin to the MCP server) with the
      // filename, size, and mime type.  textContent everywhere; download_url
      // is set via .href which doesn't parse HTML.
      function buildArtifactRow(a) {
        const row = document.createElement("div");
        row.className = "artifact-row";
        const link = document.createElement("a");
        link.className = "artifact-link";
        link.href = a.download_url || "#";
        // download attr asks the browser to save-as rather than navigate;
        // value is the suggested filename.
        link.setAttribute("download", a.name || "");
        link.setAttribute("rel", "noopener noreferrer");
        link.textContent = a.name || "(unnamed)";
        row.appendChild(link);
        const meta = document.createElement("span");
        meta.className = "artifact-meta";
        const parts = [];
        if (typeof a.size_bytes === "number") parts.push(fmtBytes(a.size_bytes));
        if (a.mime_type) parts.push(a.mime_type);
        meta.textContent = parts.length ? " · " + parts.join(" · ") : "";
        row.appendChild(meta);
        return row;
      }

      // Render an `artifact_published` event: the file was pushed to a
      // publisher destination and `remote_uri` points at it.  http(s) URIs
      // (<gui> download endpoint, <blob> storage) become a clickable link;
      // filesystem paths (<local>) are shown as plain mono text.  href is set
      // via .href (no HTML parsing) and the remote_uri is only treated as a
      // link when it parses as an http(s) URL, so a hostile string can't
      // smuggle a javascript: scheme.
      function buildPublishedArtifactEl(e) {
        const row = document.createElement("div");
        row.className = "artifact-row";

        const isHttp = typeof e.remote_uri === "string" &&
          /^https?:\/\//i.test(e.remote_uri.trim());
        if (isHttp) {
          const link = document.createElement("a");
          link.className = "artifact-link";
          link.href = e.remote_uri;
          link.setAttribute("download", e.artifact_name || "");
          link.setAttribute("rel", "noopener noreferrer");
          link.textContent = e.artifact_name || "(unnamed)";
          row.appendChild(link);
        } else {
          row.appendChild(span("artifact-link", e.artifact_name || "(unnamed)"));
          // For non-link destinations, show the path/URI as the published target.
          const uri = document.createElement("span");
          uri.className = "artifact-meta";
          uri.textContent = " → " + (e.remote_uri || "");
          row.appendChild(uri);
        }

        const meta = document.createElement("span");
        meta.className = "artifact-meta";
        const parts = [];
        if (e.destination) parts.push(e.destination);
        if (typeof e.size_bytes === "number") parts.push(fmtBytes(e.size_bytes));
        if (e.mime_type) parts.push(e.mime_type);
        meta.textContent = parts.length ? " · " + parts.join(" · ") : "";
        row.appendChild(meta);

        // Inline preview for published image artifacts served over http(s), so a
        // published plot is visible without downloading.  <img> keeps the browser
        // in secure static mode — same posture as the display-figure path.
        if (isHttp && (e.mime_type === "image/png" || e.mime_type === "image/svg+xml")) {
          const wrap = document.createElement("div");
          wrap.appendChild(row);
          const fig = document.createElement("div");
          fig.className = "display-figure";
          const img = document.createElement("img");
          img.alt = `published artifact preview (${e.mime_type})`;
          img.loading = "lazy";
          img.src = e.remote_uri;
          fig.appendChild(img);
          wrap.appendChild(fig);
          return wrap;
        }

        return row;
      }

      function renderFeed() {
        const filtered = events.filter(visible);
        stats.textContent = `${filtered.length} / ${events.length} events · ${seenServers.size} servers`;

        if (filtered.length === 0) {
          feed.innerHTML = '<div class="empty">No events match the current filters.</div>';
          return;
        }

        // Group by session_id (preserving arrival order for both events and sessions).
        const ORPHAN = "__orphan__";
        const groups = new Map(); // session_id -> { events: [], firstSeen, lastSeen, server }
        for (const e of filtered) {
          const sid = e.session_id || ORPHAN;
          let g = groups.get(sid);
          if (!g) {
            g = { events: [], firstSeen: e.timestamp, lastSeen: e.timestamp, servers: new Set() };
            groups.set(sid, g);
          }
          g.events.push(e);
          if (e.timestamp < g.firstSeen) g.firstSeen = e.timestamp;
          if (e.timestamp > g.lastSeen) g.lastSeen = e.timestamp;
          if (e.server) g.servers.add(e.server);
        }

        // Sessions ordered by most-recent activity (newest first).
        const ordered = [...groups.entries()].sort((a, b) => b[1].lastSeen - a[1].lastSeen);

        feed.innerHTML = "";
        for (const [sid, g] of ordered) {
          const sessionEl = document.createElement("div");
          sessionEl.className = "session" + (collapsedSessions.has(sid) ? " collapsed" : "");

          const header = document.createElement("div");
          header.className = "session-header";
          const label = sid === ORPHAN ? "(no session)" : `session ${sid.slice(0, 8)}`;
          const serverList = [...g.servers].join(", ") || "?";
          header.appendChild(span("caret", "▼"));
          header.appendChild(span("session-id", label));
          header.appendChild(span("server", serverList));
          header.appendChild(
            span("session-meta", g.events.length + " events · last " + fmtTs(g.lastSeen))
          );
          header.onclick = () => {
            if (collapsedSessions.has(sid)) collapsedSessions.delete(sid);
            else collapsedSessions.add(sid);
            sessionEl.classList.toggle("collapsed");
          };
          sessionEl.appendChild(header);

          const body = document.createElement("div");
          body.className = "session-body";
          // Newest event first inside each session.
          const ordered = [...g.events].sort((a, b) => b.timestamp - a.timestamp);
          for (const e of ordered) body.appendChild(buildEventEl(e));
          sessionEl.appendChild(body);

          feed.appendChild(sessionEl);
        }
      }

      function ingest(e) {
        if (e.id !== undefined && e.id !== null) {
          if (seenIds.has(e.id)) return;
          seenIds.add(e.id);
        }
        events.push(e);
        if (e.server && !seenServers.has(e.server)) {
          seenServers.add(e.server);
          renderServerChips();
        }
        renderFeed();
      }

      function setConn(state, text) {
        conn.className = "conn " + state;
        conn.textContent = text;
      }

      document.getElementById("clear-btn").onclick = () => {
        events.length = 0;
        renderFeed();
      };

      renderTypeChips();
      renderServerChips();

      // Acquire stream token (sets HttpOnly cookie), then connect.
      async function acquireStreamToken() {
        const resp = await fetch("/stream-token", { method: "POST" });
        if (!resp.ok) {
          console.warn("stream-token fetch failed:", resp.status);
          return false;
        }
        return true;
      }

      async function connect() {
        const hasToken = await acquireStreamToken();
        if (!hasToken) {
          setConn("down", "auth failed — retrying");
          setTimeout(connect, 5000);
          return;
        }

        // Replay buffer first so a refresh keeps context.
        try {
          const r = await fetch("/events/recent");
          if (r.ok) {
            const batch = await r.json();
            batch.forEach((e) => {
              if (e.id !== undefined && e.id !== null) {
                if (seenIds.has(e.id)) return;
                seenIds.add(e.id);
              }
              events.push(e);
              if (e.server) seenServers.add(e.server);
            });
            renderServerChips();
            renderFeed();
          }
        } catch (err) {
          console.error("recent fetch failed", err);
        }

        setConn("", "connecting…");
        const es = new EventSource("/stream");
        es.addEventListener("open", () => setConn("live", "live"));
        es.addEventListener("activity", (msg) => {
          try {
            ingest(JSON.parse(msg.data));
          } catch (err) {
            console.error("bad event", err, msg.data);
          }
        });
        es.addEventListener("token_expired", () => {
          // Server closed stream due to token expiry — refresh and reconnect
          es.close();
          connect();
        });
        es.addEventListener("error", () => {
          // EventSource auto-reconnects. Reflect the gap in the UI.
          setConn("down", "disconnected — retrying");
        });
      }

      connect();
    </script>
  </body>
</html>
