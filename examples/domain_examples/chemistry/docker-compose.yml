# Chemistry MCP Server — local development
#
# Prerequisites — build the base image first:
#   # From the repository root:
#   docker build -f deployment/mcp_server/base.Dockerfile -t mcp-server-base:local .
#
# To see activity events in the shared Activity UI (optional but recommended):
#   1) docker network create agora-activity     # once per host
#   2) cd activity_ui  # (or agent_helpers/activity_ui after full reorg) && docker compose up -d
# Then from this directory:
#   docker compose up --build
#
# If the activity-ui is not running, the publisher silently no-ops.

services:
  chemistry-server:
    build:
      context: ../../..
      dockerfile: examples/domain_examples/chemistry/Dockerfile
    ports:
      # Bind to localhost by default because this service is unauthenticated.
      # Do not expose it to untrusted networks unless authentication is enabled.
      - "127.0.0.1:8020:8000"
    env_file:
      - ../../../.env
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      # Reach the shared activity-ui by its service name on the agora-activity network.
      # If activity-ui isn't up, the publisher fails open (no impact on tool execution).
      ACTIVITY_UI_URL: "http://activity-ui:8030"
    networks:
      - agora-activity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  agora-activity:
    external: true
