# Chemistry MCP Server — local development
#
# Prerequisites — build the base image first:
#   # From the repository root:
#   docker build -f deployment/base.Dockerfile -t mcp-server-base:local .
#
# To see activity events in the shared Activity UI (optional but recommended):
#   1) docker network create agora-activity     # once per host
#   2) cd activity_ui && docker compose up -d
# Then from this directory:
#   docker compose up --build
#
# If the activity-ui is not running, the publisher silently no-ops.
#
# Artifact publishing:
#   Published artifacts are written to ./published_artifacts/ on the host via
#   a bind-mount volume. The container runs as a non-root user ("appuser") so
#   the host directory must be writable by that UID. Before first start, run:
#
#     mkdir -p published_artifacts && chmod 1777 published_artifacts
#
#   This is acceptable for local development. For production deployments,
#   use a named volume or configure matching UID/GID ownership.

services:
  chemistry-server:
    build:
      context: ../../..
      dockerfile: examples/domain_examples/chemistry/Dockerfile
    ports:
      # Bind to localhost by default because this service is unauthenticated.
      # Do not expose it to untrusted networks unless authentication is enabled.
      - "127.0.0.1:8020:8000"
    env_file:
      - ../../../deployment/.env.server
    volumes:
      # Mount a host directory for published artifacts so they're accessible
      # outside the container. The LocalFilePublisher writes to PUBLISH_DIR.
      - ./published_artifacts:/tmp/published_artifacts
      # Mount Azure CLI token cache files (read-only) for AzureCliCredential.
      # The Python SDK reads msal_token_cache.json directly; az CLI binary
      # session files are not needed.
      - ${HOME}/.azure/msal_token_cache.json:/home/appuser/.azure/msal_token_cache.json:ro
      - ${HOME}/.azure/azureProfile.json:/home/appuser/.azure/azureProfile.json:ro
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      # Directory where LocalFilePublisher writes artifacts (must match the volume mount).
      PUBLISH_DIR: "/tmp/published_artifacts"
      # BlobPublisher configuration — set BLOB_PUBLISH_ACCOUNT_URL to enable.
      # Authentication uses the standard credential chain (Azure CLI → Managed Identity).
      BLOB_PUBLISH_ACCOUNT_URL: "${BLOB_PUBLISH_ACCOUNT_URL:-}"
      BLOB_PUBLISH_CONTAINER: "${BLOB_PUBLISH_CONTAINER:-artifacts}"
      # Reach the shared activity-ui by its service name on the agora-activity network.
      # If activity-ui isn't up, the publisher fails open (no impact on tool execution).
      ACTIVITY_UI_URL: "http://activity-ui:8030"
      # Externally-visible URL for this server.  Used in artifact download
      # links surfaced in the activity UI; must match the published port on
      # the host so a browser click reaches the server.
      SERVER_PUBLIC_URL: "http://localhost:8020"
      # Trust sibling domain-example servers as plain-HTTP push_object targets on
      # the shared docker network.  Bearer tokens still traverse HTTP, so this
      # is only safe because all peers are on a private docker network.
      OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS: "chemistry-server,earthscience-server,energysystems-server,rstats-server"
    networks:
      - agora-activity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  agora-activity:
    external: true
