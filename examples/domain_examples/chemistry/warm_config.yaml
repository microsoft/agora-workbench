name: chemistry
description: "Execute Python code with RDKit and cheminformatics packages."
type: conda
dependency_file: |
  name: chemistry
  channels:
    - conda-forge
  dependencies:
    - python=3.11
    - pip
    - rdkit
    - numpy
    - pandas
    - scipy
    - matplotlib
    - scikit-learn
additional_commands:
  - "python -m pip install --no-deps /app/domain_examples/chemistry/chemistry_tools"
