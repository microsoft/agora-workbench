# Multi-connector network example: gateway fronting a router.
#
# Topology:
#   Client → [science-gateway] → [science-router] → chemistry, earthscience
#
# The router aggregates multiple domain servers into one endpoint.
# The gateway adds rate limiting and tool-blocking on top.
#
# Deploy with:
#   ./deploy.sh --network networks/science-hub-gateway.yaml

name: science-hub-gateway

connectors:
  - server: science-router
    params: ../parameters/router.bicepparam
    internal: true
    dockerfile: ../../base.Dockerfile
  - server: science-gateway
    params: ../parameters/gateway.bicepparam
    depends_on: [science-router]
    dockerfile: ../../base.Dockerfile

upstreams:
  - server: chemistry
    params: ../parameters/chemistry.bicepparam
    internal: true
    dockerfile: ../../../examples/servers/chemistry/Dockerfile
  - server: earthscience
    params: ../parameters/earthscience.bicepparam
    internal: true
    dockerfile: ../../../examples/servers/earthscience/Dockerfile
