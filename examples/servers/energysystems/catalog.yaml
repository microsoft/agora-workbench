# Data catalog for the energysystems domain.
#
# The energysystems server loads this manifest at startup and exposes the
# policy-aware search_data / get_artifact / list_data tools to the agent.
# Paths are relative to this file (the energysystems domain directory).

sources:
  - source_id: energysystems-demo
    path: data
    discovery: manifest
    manifest: catalog.manifest.json
    domain: energysystems
    description: "Synthetic PyPSA power-grid datasets (NetCDF) for power flow, optimal dispatch, and capacity studies."

search:
  # Keyword-only catalog: SQLite FTS5 / BM25, no embedding model, no Azure,
  # no extra dependencies. Set embedding_model to "azure-openai" (with the
  # endpoint/deployment) to add semantic vector search later.
  embedding_model: none
  hybrid_alpha: 1.0
