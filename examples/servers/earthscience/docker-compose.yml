# Earth Science MCP Server — local development
#
# Prerequisites — build the base image first:
#   # From the repository root:
#   docker build -f src/agora_workbench/deployment/templates/docker/base.Dockerfile --build-arg AGORA_WORKBENCH_SOURCE=local -t mcp-server-base:local .
#
# To see activity events in the shared Activity UI (optional but recommended):
#   1) docker network create agora-activity     # once per host
#   2) cd activity_ui && docker compose up -d
# Then from this directory:
#   docker compose up --build
#
# If the activity-ui is not running, the publisher silently no-ops.

services:
  earthscience-server:
    build:
      context: ../../..
      dockerfile: examples/servers/earthscience/Dockerfile
    ports:
      # Bind to loopback only — the server uses create_noop_auth_config()
      # which accepts any bearer token, so it must not be reachable off-host.
      - "127.0.0.1:8021:8000"
    env_file:
      - .env.server
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      # Reach the shared activity-ui by its service name on the agora-activity network.
      # If activity-ui isn't up, the publisher fails open (no impact on tool execution).
      ACTIVITY_UI_URL: "http://activity-ui:8030"
      # Externally-visible URL for this server, used in artifact download links.
      SERVER_PUBLIC_URL: "http://localhost:8021"
      # Peer registry for {name}_send(to=<peer>). Docker-network base URLs (the
      # server drops its own name automatically). Overrides the localhost
      # defaults baked into servers/peers.py for this deployment. Plain-HTTP
      # registry peers are trusted as configured here (the operator chose the
      # scheme), so no separate OBJECT_TRANSFER_TRUSTED_HTTP_HOSTS is needed —
      # bearer tokens still traverse HTTP, safe only on this private network.
      AGORA_PEER_REGISTRY: '{"chemistry":"http://chemistry-server:8000","earthscience":"http://earthscience-server:8000","energysystems":"http://energysystems-server:8000"}'
    networks:
      - agora-activity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  agora-activity:
    external: true
