name: science-hub
connector:
  server: science-hub
  params: ../parameters/connector.bicepparam
  dockerfile: ../../base.Dockerfile
  context: ../../..
upstreams:
  - server: chemistry
    params: ../parameters/chemistry.bicepparam
    internal: true
    dockerfile: ../../../src/domain_examples/chemistry/Dockerfile
    context: ../../../src/domain_examples/chemistry
  - server: earthscience
    params: ../parameters/earthscience.bicepparam
    internal: true
    dockerfile: ../../../src/domain_examples/earthscience/Dockerfile
    context: ../../../src/domain_examples/earthscience
