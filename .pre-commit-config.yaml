repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Keep in sync with the `ruff` requirement in pyproject.toml so local
    # hooks and CI format identically.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
  
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.384
    hooks:
      - id: pyright
        args: [--level, error]
        additional_dependencies: []